<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal 6</title>
</head>
<style>
    .txt-box{
        padding: 10px;
        border:10px solid violet;
        background-color: blue;
    }
    .y-txt{
        color: yellow;
    }
    .w-txt{
        color: white;
        padding:10px;
        background-color: red;
    }
    #a{
        padding-bottom:10px;
    }
    #b{
        padding-top:10px;
    }

</style>
<body>
    <div class="txt-box">
        <div class="y-txt" id="a">
            Yellow Text
            <div class="w-txt">White Text</div>
        </div>
        <div class="y-txt" id="b">
            Yellow Text
            <div class="w-txt">White Text</div>
        </div>
    </div>
</body>
</html>
