<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal 9</title>
</head>
<style>
    *{
        color: white;
    }
    h1{
        color: black;
    }
    .box-txt{
        display: inline-flex;
        justify-items: center;
    }
    .r-txt{
        margin:2px;
        background-color: red;
        width: 250px;
        height: 250px;
    }
    .g-txt{
        margin:2px;
        background-color: green;
        width: 250px;
        height: 250px;
    }
    .b-txt{
        margin:2px;
        background-color: blue;
        width: 250px;
        height: 250px;
    }
</style>
<body>
    <h1>CSS Display Property</h1>
    <div class="box-txt">
        <div class="r-txt">Red Paragraph</div>
        <div class="g-txt">Green Paragraph</div>
        <div class="b-txt">Blue Paragraph</div>
    </div>
</body>
</html>
