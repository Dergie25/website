<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goal Navigation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #154749;
            padding: 15px;
            text-align: center;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        nav ul li a {
            display: block;
            text-decoration: none;
            color: white;
            background-color: #166534;
            padding: 12px 18px;
            border-radius: 5px;
            transition: 0.3s;
        }
        nav ul li a:hover {
            background-color: #22c55e;
            color: black;
        }
        .content {
            text-align: center;
            padding: 50px 20px;
        }

        .content h1 {
            color: #14532d;
            margin-bottom: 15px;
        }

        .content p {
            color: #555;
            font-size: 18px;
        }
    </style>
</head>
